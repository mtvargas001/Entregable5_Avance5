<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restaurante Bajo Tierra</title>
    <link rel="stylesheet" href="style.css"> <link rel="stylesheet" href="CSS/style.css"> </head>
<body>
    <header class="header">
        <h1>Sabores al descubrimiento</h1>
        <nav>
            <a href="#menu">Menú</a>
        </nav>
    </header>

    <section id="menu" class="menu">
        <div class="menu-items">
            
            <div class="menu-item">
                <img src="sopataverna.png" onerror="this.src='img/sopataverna.png'" alt="Sopa">
                <h3>Sopa de Caverna</h3>
            </div>

            <div class="menu-item">
                <img src="crispdeLava.png" onerror="this.src='img/crispdeLava.png'" alt="Crisp">
                <h3>Crisp de Lava</h3>
            </div>

            <div class="menu-item">
                <img src="fondocueva.JPG" onerror="this.src='img/fondocueva.JPG'" alt="Fondo">
                <h3>Ambiente</h3>
            </div>

            <div class="menu-item">
                <img src="bebidavolcanica.png" onerror="this.src='img/bebidavolcanica.png'" alt="Bebida">
                <h3>Bebida Volcánica</h3>
            </div>

        </div>
    </section>

    <script src="script1.js"></script>
    <script src="JS/script1.js"></script>
</body>
</html>
